# Builds and tests WarioWare Gold on Linux, macOS and Windows.
name: WarioWare Gold CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Sound library headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Fonts for Japanese, so the font tests draw with one
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fonts-noto-cjk
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - run: cargo test --release --workspace
      - name: Keep the Windows program
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: warioware-gold-recomp-windows
          path: target/release/warioware-gold-recomp.exe
